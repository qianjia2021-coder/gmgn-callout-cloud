name: callout-cloud

# 喊单(callout)云端独立实例：只在「本机心跳过期」时接管，与本机 callout_push.py 互斥。
# 独立仓库 / 独立状态 / 独立心跳 / 独立并发组，不与 top1、热搜、精选任务冲突。
#
# 为什么是「链式续跑」：GitHub 对本账号仓库的 schedule 做了大幅降频（实测 cron 写 */5，
# 实际约 8 小时才跑一次），单靠 schedule 无法做到 5 分钟内接管。
# 因此每次运行在 runner 内连续轮询约 5.5 小时（每 5 分钟一轮），
# 结束前用 workflow_dispatch 派出下一轮，形成不断线的接力链；
# schedule 仅作为兜底：链路万一断掉，最迟约 8 小时后会被定时任务重新种上。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印将推送的消息，不发送、不写状态'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']
      self_test:
        description: '只发一条 Telegram 自检消息，不取数'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']
      force_takeover:
        description: '忽略心跳、强制走接管路径（HB_STALE=0）'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']
      chain:
        description: '链式续跑（1=本轮结束自动续下一轮；schedule 触发默认续）'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']
      chain_seconds:
        description: '单轮连续运行秒数（留空用默认 20000；仅调试用）'
        required: false
        default: ''

run-name: "callout-cloud | dry=${{ inputs.dry_run || '0' }} test=${{ inputs.self_test || '0' }} chain=${{ inputs.chain || 'sched' }}"

concurrency:
  group: callout-cloud
  cancel-in-progress: false

permissions:
  actions: write     # 链式续跑需要触发 workflow_dispatch
  contents: write    # 读写 callout_state.json / callout_heartbeat.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # 单 job 上限 6 小时，留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 gmgn-cli
        run: npm install -g gmgn-cli --no-audit --no-fund

      - name: 写入 GMGN 配置
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          mkdir -p "$HOME/.config/gmgn"
          printf 'GMGN_API_KEY=%s\n' "$GMGN_API_KEY" > "$HOME/.config/gmgn/.env"
          chmod 600 "$HOME/.config/gmgn/.env"
          gmgn-cli config --check || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet telethon requests

      - name: 检查必需 Secrets（只检查存在性，不打印值）
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
        run: |
          missing=0
          for n in GMGN_API_KEY TG_API_ID TG_API_HASH TG_STRING_SESSION; do
            if [ -z "$(printenv "$n")" ]; then
              echo "缺少必需 secret: $n"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "必需 Secrets 均已配置"

      - name: 运行喊单云端监控（链式循环）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          TG_CHAT_ID: '-5525201436'
          PAUSE_CHAINS: 'bsc'
          HB_STALE: "${{ inputs.force_takeover == '1' && '0' || '120' }}"
          DRY_RUN: "${{ inputs.dry_run || '0' }}"
          SELF_TEST: "${{ inputs.self_test || '0' }}"
          PYTHONUNBUFFERED: '1'
          CHAIN_RUN_SECONDS: "${{ inputs.chain_seconds || '20000' }}"
          POLL_SLEEP: '300'
        run: |
          set -u
          # 一次性任务（自检 / dry-run）只跑一轮，不进循环
          if [ "$SELF_TEST" = "1" ] || [ "$DRY_RUN" = "1" ]; then
            python cloud_callout.py
            exit 0
          fi
          end=$(( $(date +%s) + CHAIN_RUN_SECONDS ))
          rounds=0
          while :; do
            rounds=$(( rounds + 1 ))
            echo "[$rounds 轮] $(date '+%H:%M:%S') 开始"
            python cloud_callout.py || echo "[$rounds 轮] 本轮返回非 0（下一轮继续）"
            now=$(date +%s)
            if [ $(( end - now )) -le "$POLL_SLEEP" ]; then break; fi
            sleep "$POLL_SLEEP"
          done
          echo "本轮连续运行结束，共 $rounds 轮"

      - name: 续跑下一轮
        if: ${{ inputs.dry_run != '1' && inputs.self_test != '1' && inputs.chain != '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: callout-chain" \
              "https://api.github.com/repos/$REPO/actions/workflows/callout-cloud.yml/dispatches" \
              -d '{"ref":"main","inputs":{"chain":"1"}}' || echo 000)
            if [ "$code" = "204" ]; then
              echo "已派出下一轮（第 $i 次尝试成功）"
              exit 0
            fi
            echo "派出下一轮失败 code=$code（第 $i 次），20 秒后重试"
            cat /tmp/dispatch.out 2>/dev/null || true
            sleep 20
          done
          echo "续跑连续失败；等 schedule 兜底重新种上链路"
          exit 1
